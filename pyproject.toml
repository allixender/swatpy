[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swatpy"
dynamic = ["version"]
description = "A Python package to run, control/manipulate and analyse SWAT2012 models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Kmoch", email = "alexander.kmoch@ut.ee" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "chardet",
]
keywords = ["SWAT", "SWAT2012", "hydrology", "calibration", "spotpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
calibration = ["spotpy", "scipy", "pandas"]
mpi = ["spotpy", "mpi4py"]
test = ["pytest>=7"]
dev = ["pytest>=7", "build", "twine", "ruff"]

[project.urls]
Homepage = "https://github.com/allixender/swatpy"
Source = "https://github.com/allixender/swatpy"
Issues = "https://github.com/allixender/swatpy/issues"
DOI = "https://doi.org/10.5281/zenodo.6322023"

[tool.setuptools.dynamic]
version = { attr = "swatpy.__version__" }

[tool.setuptools.packages.find]
include = ["swatpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "swat: tests on the SWAT2012 demo project from github.com/chrisschuerz/SWATdata (downloaded on demand, set SWATPY_TEST_DOWNLOAD=1)",
    "swat_run: tests that run the SWAT2012 rev 637 executable (linux x86_64 only)",
]

[tool.ruff]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# syntax errors and undefined names only, the legacy code is not style-normalised
select = ["E9", "F63", "F7", "F82"]
