site_name: swatpy
site_description: Run, edit, read out and calibrate SWAT2012 models from Python
site_url: https://allixender.github.io/swatpy/
repo_url: https://github.com/allixender/swatpy
repo_name: allixender/swatpy
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    primary: teal
    accent: deep orange
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          inventories:
            - url: https://docs.python.org/3/objects.inv
              domains: [py, std]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            docstring_style: google

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Parameters: parameters.md
  - Output readers: readout.md
  - API reference: api.md
  - Development: development.md
